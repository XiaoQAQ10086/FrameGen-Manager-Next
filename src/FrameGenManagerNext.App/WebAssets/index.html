<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FrameGen Manager-Next</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="app.png" alt="" class="brand-mark" />
        <div>
          <div class="brand-name">FrameGen Manager-Next</div>
          <div class="brand-version" id="app-version">v2.0.0</div>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button type="button" data-page="framegen" class="nav-item active">
          <span class="nav-icon">▦</span><span data-nav-label="Nav.Library"></span>
        </button>
        <button type="button" data-page="smooth-motion" class="nav-item">
          <span class="nav-icon">▶</span><span data-nav-label="Nav.SmoothMotion"></span>
        </button>
        <button type="button" data-page="dlss5" class="nav-item">
          <span class="nav-icon">◇</span><span data-nav-label="Nav.Dlss5"></span>
        </button>
        <button type="button" data-page="logs" class="nav-item">
          <span class="nav-icon">≡</span><span data-nav-label="Nav.Logs"></span>
        </button>
        <button type="button" data-page="settings" class="nav-item">
          <span class="nav-icon">⚙</span><span data-nav-label="Nav.Settings"></span>
        </button>
        <button type="button" data-page="about" class="nav-item">
          <span class="nav-icon">ⓘ</span><span data-nav-label="Nav.About"></span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div data-nav-label="Nav.Footer1"></div>
        <div class="muted" data-nav-label="Nav.Footer2"></div>
      </div>
    </aside>

    <section class="workspace">
      <div class="global-progress" id="global-progress"><i></i></div>
      <main id="view" class="view"></main>
    </section>
  </div>

  <div id="modal-root"></div>
  <div class="toast hidden" id="toast"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
