<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FrameGen Manager-Next</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <img src="app.png" alt="" class="brand-mark" />
        <div>
          <div class="brand-name">FrameGen Manager-Next</div>
          <div class="brand-version"><span id="app-version">v2.0.0</span><span class="brand-tagline">一键为20和30系显卡用户部署帧生成及DLSS5</span></div>
        </div>
      </div>

      <nav class="nav" id="nav">
        <span class="nav-indicator" aria-hidden="true"></span>
        <button type="button" data-page="framegen" class="nav-item active">
          <span data-nav-label="Nav.Library"></span>
        </button>
        <button type="button" data-page="smooth-motion" class="nav-item">
          <span data-nav-label="Nav.SmoothMotion"></span>
        </button>
        <button type="button" data-page="dlss5" class="nav-item">
          <span data-nav-label="Nav.Dlss5"></span>
        </button>
        <button type="button" data-page="logs" class="nav-item">
          <span class="nav-icon">≡</span><span data-nav-label="Nav.Logs"></span>
        </button>
        <button type="button" data-page="about" class="nav-item">
          <span class="nav-icon">ⓘ</span><span data-nav-label="Nav.About"></span>
        </button>
        <button type="button" data-page="donate" class="nav-item">
          <span class="nav-icon">♡</span><span data-nav-label="Nav.Donate"></span>
        </button>
      </nav>
      <select class="lang-select" id="lang-select" aria-label="Language">
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
    </header>

    <div class="global-progress hidden" id="global-progress" role="status" aria-live="polite">
      <div class="gp-head"><span class="gp-phase"></span><span class="gp-percent"></span></div>
      <div class="gp-subject"></div>
      <div class="gp-track"><i></i></div>
    </div>
    <main id="view" class="view">
      <div class="boot">
        <img src="app.png" alt="" class="boot-mark" />
        <div class="boot-spinner"></div>
        <div class="boot-title">正在加载游戏库…</div>
        <div class="boot-sub">正在读取本地缓存</div>
      </div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div class="toast hidden" id="toast"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
