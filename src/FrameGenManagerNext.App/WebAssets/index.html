<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>帧生成</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="page-head">
      <div>
        <h1>帧生成</h1>
        <p>选择游戏后点“部署”，再调整帧生成参数。</p>
      </div>
      <div class="head-actions">
        <button class="btn" id="add-game" type="button">添加游戏</button>
        <button class="btn" id="cancel-scan" type="button" disabled>取消</button>
        <button class="btn primary" id="scan-games" type="button">扫描游戏</button>
      </div>
    </header>

    <div class="notice hidden" id="notice"></div>

    <main class="layout">
      <aside class="side">
        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>GPU 状态</h2>
              <p class="muted" id="gpu-status">正在读取…</p>
            </div>
            <button class="btn small" id="refresh" type="button">刷新</button>
          </div>
          <div class="gpu-name" id="gpu-name">—</div>
          <div class="kv"><span>驱动版本</span><b id="gpu-driver">—</b></div>
          <div class="gate-row">
            <div><span class="muted small">帧生成</span><b id="gpu-fg">—</b></div>
            <div><span class="muted small">Smooth Motion</span><b id="gpu-sm">—</b></div>
          </div>
          <div class="kv"><span>GPU 路由</span><b id="gpu-route">—</b></div>
          <div class="hags">
            <div class="kv"><span>硬件加速 GPU 计划</span><b id="gpu-hags">—</b></div>
            <button class="btn small ghost" id="open-hags" type="button">打开 HAGS 设置</button>
          </div>
        </section>

        <section class="panel spoof">
          <details>
            <summary>显卡名称伪装（高级）</summary>
            <div class="kv"><span>当前显示</span><b id="spoof-current">—</b></div>
            <div class="kv"><span>驱动记录</span><b id="spoof-driver">—</b></div>
            <p class="muted small">改名会导致显卡名与硬件 ID 不一致；需要管理员权限，重启后生效。</p>
          </details>
        </section>
      </aside>

      <section class="content">
        <div class="statusline">
          <span id="status">正在载入…</span>
          <div class="progress"><i id="progress"></i></div>
        </div>
        <div class="game-list" id="games"></div>
        <div class="empty hidden" id="empty">
          <p>还没有游戏。点击“扫描游戏”，或手动添加一个 EXE。</p>
          <button class="btn primary" id="empty-scan" type="button">扫描游戏</button>
        </div>
      </section>
    </main>
  </div>

  <div class="overlay hidden" id="overlay">
    <section class="modal" role="dialog" aria-modal="true">
      <header class="modal-head">
        <div>
          <h2 id="modal-title">部署</h2>
          <p class="muted" id="modal-path"></p>
        </div>
        <button class="icon-btn" id="close-modal" type="button" aria-label="关闭">✕</button>
      </header>
      <p class="hint">以下选项只影响本次部署；请确认游戏已关闭。</p>
      <div class="options">
        <label>代理
          <select id="opt-proxy"></select>
        </label>
        <label>优化
          <select id="opt-optimized"></select>
        </label>
        <label>帧数
          <select id="opt-frames"></select>
        </label>
        <label>Preset
          <select id="opt-preset"></select>
        </label>
        <label>引擎
          <select id="opt-engine"></select>
        </label>
        <label>超分
          <select id="opt-sr"></select>
        </label>
        <label class="xess hidden">XeSS Flow
          <select id="opt-flow"></select>
        </label>
        <label class="xess hidden">HUD-less
          <select id="opt-hudless"></select>
        </label>
      </div>
      <footer class="modal-foot">
        <span class="muted small">部署前请关闭游戏</span>
        <div class="foot-actions">
          <button class="btn ghost" id="modal-cancel" type="button">取消</button>
          <button class="btn" id="modal-restore" type="button">还原</button>
          <button class="btn primary" id="modal-deploy" type="button">部署</button>
        </div>
      </footer>
    </section>
  </div>

  <div class="toast hidden" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
