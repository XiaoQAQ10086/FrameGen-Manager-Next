[workspace]
resolver = "3"
members = [
    "crates/fgm-domain",
    "crates/fgm-core",
    "crates/fgm-infra",
    "crates/fgm-ffi",
    "crates/fgm-node",
    "crates/fgm-cli",
]

[workspace.package]
version = "2.3.6"
edition = "2024"
license = "MIT"

[workspace.dependencies]
fgm-domain = { path = "crates/fgm-domain" }
fgm-core = { path = "crates/fgm-core" }
fgm-infra = { path = "crates/fgm-infra" }
flate2 = "1"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
