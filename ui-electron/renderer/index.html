<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>FrameGen Manager-Next</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="motion.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <img src="app.png" alt="" class="brand-mark" />
        <div>
          <div class="brand-name">FrameGen Manager-Next</div>
          <div class="brand-version"><span id="app-version">v2.3.4</span><span class="brand-tagline" data-nav="appTagline"></span></div>
        </div>
      </div>

      <nav class="nav" id="nav">
        <span class="nav-indicator" aria-hidden="true"></span>
        <button type="button" data-page="framegen" class="nav-item active"><span data-nav="navFrameGeneration"></span></button>
        <button type="button" data-page="smooth-motion" class="nav-item"><span data-nav="navSmoothMotion"></span></button>
        <button type="button" data-page="dlss5" class="nav-item"><span data-nav="navDlss5"></span></button>
        <button type="button" data-page="anr" class="nav-item"><span data-nav="navAnr"></span></button>
        <button type="button" data-page="logs" class="nav-item"><span class="nav-icon">≡</span><span data-nav="navLogs"></span></button>
        <button type="button" data-page="about" class="nav-item"><span class="nav-icon">ⓘ</span><span data-nav="navAbout"></span></button>
        <button type="button" data-page="donate" class="nav-item"><span class="nav-icon">♡</span><span data-nav="navDonate"></span></button>
      </nav>
      <select class="lang-select" id="lang-select" aria-label="Language">
        <option value="system">跟随系统</option>
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
    </header>

    <div class="global-progress hidden" id="global-progress" role="status" aria-live="polite">
      <div class="gp-head"><span class="gp-phase"></span><span class="gp-percent"></span><button class="gp-cancel" data-action="cancel-op" type="button">取消</button></div>
      <div class="gp-subject"></div>
      <div class="gp-track"><i></i></div>
    </div>

    <main id="view" class="view"></main>
  </div>

  <div id="modal-root"></div>
  <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
