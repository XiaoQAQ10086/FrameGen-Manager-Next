name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Rust and Electron gates
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        shell: pwsh
        run: rustup toolchain install nightly-2026-11-17 --profile minimal --component rustfmt --component clippy

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui-electron/package-lock.json

      - name: Install Electron dependencies
        working-directory: ui-electron
        run: npm ci --no-audit --no-fund

      - name: Verify
        shell: pwsh
        run: ./build/verify-rust-electron.ps1
