name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Rust and Flutter gates
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        shell: pwsh
        run: rustup toolchain install nightly-2026-11-17 --profile minimal --component rustfmt --component clippy

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: afad7960e1f4dafdb28a4c45e5e001d4a1994000
          cache: true

      - name: Verify
        shell: pwsh
        run: ./build/verify-rust-flutter.ps1
